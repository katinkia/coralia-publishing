<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're on the list &middot; Coralia Publishing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#F3EDE3;color:#1B1815;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .card{max-width:560px;text-align:center}
  .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#7A2E2A;margin-bottom:20px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:44px;letter-spacing:-1px;line-height:1.1;margin-bottom:18px}
  h1 em{font-style:italic}
  p{color:#5C554B;font-size:17px;line-height:1.55;margin-bottom:14px}
  .back{display:inline-block;margin-top:26px;background:#1B1815;color:#F3EDE3;padding:13px 22px;border-radius:6px;
        text-decoration:none;font-weight:600;font-size:15px}
  .back:hover{background:#7A2E2A}
  @media (max-width:520px){h1{font-size:34px}}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Coralia Publishing</div>
    <h1>You're on the <em>list.</em></h1>
    <p>One email per release. Cover reveals, launch-week prices, the occasional deleted scene. Nothing else.</p>
    <p>While you wait, book one of the Porthmellin Cove Mysteries is free.</p>
    <a class="back" href="/#books">Back to the shelf</a>
  </div>
</body>
</html>
